[project]
name = "nsa_import"
authors = [{ name = "NSA", email = "erp@nsa.local" }]
description = "NSA Import: Local/Import Purchase Order, Letter of Credit, Shipping Documents, Customs Clearance (GD), Landed Cost and LC Retirement for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
